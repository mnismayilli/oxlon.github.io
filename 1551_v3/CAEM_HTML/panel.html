<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAEM iş paneli</title>
<style>
:root {
  color-scheme: light;
  --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #F8FAFB; --sunk: #EEF2F5;
  --ink: #15202B; --ink-2: #455463; --muted: #738190; --line: #DDE3E9; --line-2: #EDF1F4;
  --accent: #3B4F9A; --accent-ink: #2C3C78; --accent-soft: #ECEFFA;
  --scen: #1F6FB2; --scen-soft: #E6EFF8; --base: #B4651A;
  --up: #1E7B4F; --up-soft: #E5F3EB; --down: #B3261E; --down-soft: #FBE9E7;
  --warn: #8A5300; --warn-soft: #FFF2D9; --coef: #6A3FB5; --coef-soft: #F0EAFA;
  --fc: #F2F7FB;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
  --r: 8px; --top: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding-inline: 20px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.mark { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #3B4F9A 0 50%, #C8A13A 50% 100%); flex: none; }
.brand b { font-size: 15px; display: block; line-height: 1.1; } .brand small { color: var(--muted); font-size: 11.5px; }
.tabs { display: flex; gap: 2px; margin-left: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 7px; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; border: 0; background: none; cursor: pointer; }
.tab:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
.tab.on { background: var(--accent-soft); color: var(--accent-ink); }
.tab svg { width: 16px; height: 16px; flex: none; }
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.kbtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--muted); cursor: pointer; min-width: 220px; }
.kbtn:hover { border-color: var(--accent); }
.kbtn kbd { margin-left: auto; font: 11px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink-2); }
.ibtn { display: inline-flex; align-items: center; justify-content: center; height: 36px; min-width: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 700; color: var(--ink-2); white-space: nowrap; font-size: 13px; }
.ibtn:hover { border-color: var(--accent); color: var(--accent-ink); }

/* ---------- scenario status bar ---------- */
.scenbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); z-index: 25; background: var(--scen-soft); border-bottom: 1px solid #C9DBEE; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 20px; font-size: 13.5px; }
.scenbar b { color: var(--scen); }
.dotline { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- layout ---------- */
.view { max-width: 1320px; margin: 0 auto; padding-inline: 24px; padding-block: 26px 80px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
.lead { color: var(--ink-2); font-size: 16px; max-width: 70ch; margin: 8px 0 0; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h h2 { font-size: 19px; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pad { padding: 16px 18px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent-ink); text-decoration: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.pri:hover { background: var(--accent-ink); color: #fff; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; line-height: 1.7; }
.chip.acc { background: var(--accent-soft); color: var(--accent-ink); }
.chip.scen { background: var(--scen-soft); color: var(--scen); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.coef { background: var(--coef-soft); color: var(--coef); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.help { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--sunk); color: var(--ink-2); font-size: 11px; font-weight: 700; cursor: help; vertical-align: 1px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.hero-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hk { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.hk b { font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hk span { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.action { display: flex; flex-direction: column; gap: 8px; padding: 18px; color: var(--ink); min-height: 150px; }
a.action:hover { text-decoration: none; border-color: var(--accent); box-shadow: 0 4px 16px rgba(59,79,154,.10); }
.action .ic { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.action .ic svg { width: 20px; height: 20px; }
.action h3 { font-size: 16px; } .action p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.action .go { margin-top: auto; font-weight: 700; color: var(--accent); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.step { padding: 16px 18px; position: relative; border-right: 1px solid var(--line-2); }
.step:last-child { border-right: 0; }
.step .n { font: 700 12px var(--mono); color: var(--accent); }
.step h4 { font-size: 15px; margin: 4px 0; } .step p { margin: 0; font-size: 13px; color: var(--ink-2); }
.step .cnt { margin-top: 8px; font-size: 12px; color: var(--muted); }

/* ---------- results ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: 12.5px; color: var(--ink-2); font-weight: 600; line-height: 1.3; min-height: 2.6em; }
.kpi .v { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .v small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; letter-spacing: 0; }
.kpi .d { font-size: 12px; font-weight: 700; min-height: 1.5em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); } .dl { color: var(--scen); font-weight: 700; }
.spark { display: block; width: 100%; height: auto; }
.itbl-wrap { overflow-x: auto; }
table.itbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.itbl th, .itbl td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.itbl thead th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: right; background: var(--surface-2); position: sticky; top: 0; }
.itbl thead th.l { text-align: left; }
.itbl thead th .st { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.itbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.itbl td.fc, .itbl th.fc { background: var(--fc); }
.itbl tbody tr { cursor: pointer; }
.itbl tbody tr:hover td { background: #EEF1FA; }
.itbl td.lab { white-space: normal; min-width: 240px; }
.itbl td.lab .u { color: var(--muted); font-size: 12px; margin-left: 6px; }
.itbl tr.sub td.lab { padding-left: 26px; color: var(--ink-2); }
.itbl tr.chg td.n.fc { color: var(--scen); font-weight: 700; }
.itbl .dcell { font-size: 12px; font-weight: 700; }
/* ---------- macro impact + manual-vs-model comparison ---------- */
.imp-sec + .imp-sec { border-top: 8px solid var(--surface-2); }
.imp-h { margin: 0; padding: 10px 12px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); display: flex; align-items: center; gap: 8px; }
.imp-sec .itbl tbody tr { cursor: default; }
.itbl .dcell .was { color: var(--muted); font-weight: 600; text-decoration: line-through; }
.itbl .dcell .up { color: #1F6FB2; }
.itbl .dcell .dn { color: #B4651A; }
.mm { margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); min-width: 0; max-width: 100%; }
.mm-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 10px; background: var(--surface-2); font-size: 12px; }
.mm-h b { font-size: 12.5px; }
.mm-t { overflow-x: auto; }
.mm table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mm th, .mm td { padding: 4px 8px; text-align: right; border-top: 1px solid var(--line-2); white-space: nowrap; }
.mm th.l, .mm td.l { text-align: left; white-space: normal; }
.mm thead th { font-size: 11px; color: var(--muted); font-weight: 700; border-top: 0; }
.mm tr.use td { font-weight: 700; }
.mm tr.off td { color: var(--muted); }
.mm input { width: 88px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; font: inherit; font-size: 12.5px; background: var(--surface); color: inherit; font-variant-numeric: tabular-nums; }
.mm input.mod { border-color: var(--scen); background: #F0F6FC; font-weight: 700; }
.mm input:disabled { background: var(--surface-2); color: var(--muted); }
.mm .gap { font-weight: 700; }
.mm .gap.z { color: var(--muted); font-weight: 400; }
.rstat { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; background: var(--surface); }
.rstat.open { border-left-color: #C08A2E; background: #FDF8EE; }
.rstat.done { border-left-color: #2F6B3D; background: #F2F8F4; }
.rstat.base { border-left-color: #8A96A3; }
.rstat .rs-t { font-weight: 700; font-size: 14px; margin: 0 0 3px; }
.rstat .rs-d { font-size: 13px; color: var(--ink-2); margin: 0; line-height: 1.55; }
.rstat .rs-a { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 720px) { .rstat { flex-direction: column; } .rstat .rs-a { margin-left: 0; } }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; margin-bottom: 12px; }
.sum .s { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--surface); }
.sum .s b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.sum .s span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.sum .s .arr { font-size: 12px; color: var(--muted); font-weight: 400; }
.sum .s.ok b { color: #2F6B3D; }
.sum .s.warn b { color: #A3352A; }
.movers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 12px; }
.movers .m { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
.movers h4 { margin: 0; padding: 7px 11px; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.movers ul { list-style: none; margin: 0; padding: 4px 0; }
.movers li { display: flex; gap: 8px; align-items: baseline; padding: 4px 11px; font-size: 12.5px; }
.movers li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.movers li .yr { color: var(--muted); font-size: 11px; }
.movers li .dv { font-variant-numeric: tabular-nums; font-weight: 700; }
.movers li .dv.up { color: #1F6FB2; } .movers li .dv.dn { color: #B4651A; }
.sum-note { font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px; line-height: 1.55; }
.chip.bad { background: #FCF1F0; border-color: #E0A6A0; color: #A3352A; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
.toolbar input[type=search] { height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; min-width: 240px; background: var(--surface); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- scenario ---------- */
.scen-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
.impact { position: sticky; top: calc(var(--top) + 60px); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.assump { padding: 14px 16px; display: grid; grid-template-columns: minmax(200px, 1fr) auto; gap: 10px 16px; align-items: center; border-bottom: 1px solid var(--line-2); }
.assump:last-child { border-bottom: 0; }
.assump h4 { font-size: 14.5px; } .assump .src { font-size: 12px; color: var(--muted); }
.assump .why { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.yrs { display: grid; grid-template-columns: repeat(var(--ny, 6), 78px); gap: 6px; }
.yr { display: flex; flex-direction: column; gap: 2px; }
.yr label { font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.yr input { height: 32px; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; font-variant-numeric: tabular-nums; background: var(--surface); }
.yr input:focus { border-color: var(--scen); outline: none; box-shadow: 0 0 0 3px var(--scen-soft); }
.yr input.follow { background: var(--surface-2); color: var(--ink-2); }
.yr input.mod { background: #FFF3BF; border-color: #E5C24F; color: #5A3C00; font-weight: 700; }
.a-tools { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.a-tools input { width: 70px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; }
.grp-h { padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; border-radius: 10px 10px 0 0; }
.imp-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; align-items: baseline; }
.imp-row:last-child { border-bottom: 0; }
.imp-row .b { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.imp-row .d { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; min-width: 78px; }

/* exogenous catalogue */
.sectabs { display: flex; gap: 6px; flex-wrap: wrap; }
.stab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.stab:hover { border-color: var(--accent); color: var(--accent-ink); }
.stab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.stab .cnt { font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }
.xlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.xlegend .sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); vertical-align: -1px; margin-right: 5px; }
.xlegend .sw.follow { background: var(--surface-2); } .xlegend .sw.calc { background: var(--sunk); } .xlegend .sw.mod { background: #FFF3BF; border-color: #E5C24F; }
.xbook { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; margin: 18px 0 8px; }
.xbook:first-child { margin-top: 0; }
details.xgrp { margin-bottom: 8px; }
details.xgrp > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.xgrp > summary::-webkit-details-marker { display: none; }
details.xgrp > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.xgrp[open] > summary::before { transform: rotate(90deg); }
details.xgrp[open] > summary { border-bottom: 1px solid var(--line-2); }
.xs-t { font-weight: 700; }
.xhead, .xrow { display: grid; grid-template-columns: minmax(200px, 1fr) auto 122px; gap: 6px 14px; align-items: center; padding: 8px 14px; }
.xhead { padding-block: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
.xhead .yrs span { text-align: center; }
.xrow { border-top: 1px solid var(--line-2); }
.xrow.xmod { background: #FFFCEB; }
.xrow.flash { background: #FFF3BF; transition: background .3s; }
.xrow .yr label { display: none; }
.xl { font-size: 13px; line-height: 1.35; }
.xl .rn { font: 11px var(--mono); color: var(--muted); margin-right: 6px; }
.xl .blk { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.xt { display: flex; gap: 4px; align-items: center; }
.xt input { width: 58px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; }
.yr input.calc { background: var(--sunk); color: var(--muted); font-style: italic; border-color: var(--line-2); }

/* ---------- explorer ---------- */
.exp-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.tree { position: sticky; top: calc(var(--top) + 16px); max-height: calc(100vh - var(--top) - 32px); overflow-y: auto; padding: 8px 0; }
.tree input { margin: 4px 12px 8px; width: calc(100% - 24px); height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; }
.tsec { padding: 10px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tbook { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--ink); }
.tbook:hover { background: var(--surface-2); }
.tsheet { display: block; padding: 4px 14px 4px 34px; font-size: 13px; color: var(--ink-2); border-left: 3px solid transparent; }
.tsheet:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.tsheet.on { background: var(--accent-soft); color: var(--accent-ink); border-left-color: var(--accent); font-weight: 700; }
.tsheet small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

    });

  // ------------------------------------------------------------------ GUIDE
  function pageGuide(v) {

    var sec = [['baslangic', 'CAEM nədir'], ['axin', 'İş axını'], ['panel', 'Bu paneldən istifadə'], ['metod', 'Model və manual proqnoz'], ['uzlas', 'Uzlaşdırma və kalibrləmə'], ['yenil', 'Yeni il və yeni fayl'], ['luget', 'Terminlər'], ['sual', 'Tez-tez verilən suallar']];
    var h = '<div class="eyebrow">Bələdçi</div><h1 class="h1" style="margin-top:6px">CAEM iş panelinə bələdçi</h1><div class="guide" style="margin-top:22px"><nav class="toc">' + sec.map(function (s) { return '<a href="#" data-to="' + s[0] + '">' + s[1] + '</a>'; }).join('') + '</nav><div>';
    h += '<section class="gsec" id="g-baslangic"><h2>CAEM nədir</h2><p>CAEM — BVF-nin Maliyyə Proqramlaşdırması və Siyasətləri (FPP 2.0) layihəsinin «Pillar 1» Excel çərçivəsidir: FPP-nin uçot eyniliklərini (real və nominal ÜDM, fiskal sektor, tədiyə balansı, monetar icmal) kiçik davranış modeli ilə birləşdirir. Model illik tezlikdədir, proqnoz üfüqü 5 ildir (' + INFO.firstYear + '–' + INFO.endYear + '). Qiymətlər bloku: inflyasiya Phillips əyrisi, siyasət faizi Taylor qaydası, məzənnə açıq faiz pariteti (UİP) və alıcılıq qabiliyyəti pariteti (PPP) ilə; xərc komponentləri xəta-korreksiya tənlikləri ilə proqnozlaşdırılır. Hər tənlik üçün proqnozu model və ya manual vermək olar.</p></section>';
    h += '<section class="gsec" id="g-axin"><h2>İş axını (sənədə əsasən)</h2><ol><li><b>Giriş</b> — INPUT vərəqində ilk proqnoz ili, məzənnə rejimi, fiskal ilin sonu, göstərmə miqyasları.</li><li><b>Məlumatlar</b> — ilkin məlumat vərəqləri (External sector, Real sector, Prices, Fiscal, BOP, Social, Monetary, Oil_and_gas) «Data» vərəqinə indikator kodları ilə yığılır; «Accounting consistency» əsas eynilikləri yoxlayır.</li><li><b>Son inkişaflar və xarici mühit</b> — A1, A2: tərəfdaşların artımı və inflyasiyası, neft və qaz qiymətləri, ABŞ faizləri.</li><li><b>Trend–kəsir təhlili</b> — B1a–B3: HP filtri (prior-larla) və istehsal funksiyası ilə potensial ÜDM, buraxılış kəsiri, neytral faiz və digər trendlər.</li><li><b>Proqnozlar</b> — 1a (sahələr üzrə real ÜDM), 1b (inflyasiya, məzənnə, deflyatorlar), 1c (faiz), 1d (xərc komponentləri), 1e (sosial sektor), 3a–3b (fiskal və borc), 2a–2b (tədiyə balansı), 4 (monetar icmal).</li><li><b>Nominal ÜDM, yığım–investisiya</b> — 5a, 5b; <b>uzlaşdırma</b> — makroslar ilə.</li><li><b>Orta müddətli perspektiv və ssenarilər</b> — 6a, 6b, MOE_report, risklər, 7. Scenario, 8a–8b.</li></ol></section>';
    h += '<section class="gsec" id="g-panel"><h2>Bu paneldən istifadə</h2><div class="grid g3"><div class="card recipe"><h4>Neft qiyməti ssenarisi</h4><ol><li>«Fərziyyələr» → «Ekzogen fərziyyələr».</li><li>«Xarici mühit» qrupunda neftin qiymətini tapın (axtarış: <i>neft</i>).</li><li>«Bütün illər» sahəsinə −20 yazıb «+% bazaya» basın.</li><li>Sağdakı panel təsiri göstərir; «Nəticələr» bölməsində ətraflı baxın.</li><li>«Uzlaşdır» düyməsi ilə ÜDM-i uzlaşdırın və ssenarini saxlayın.</li></ol></div>' +
      '<div class="card recipe"><h4>Üzən məzənnə rejimi</h4><ol><li>«Fərziyyələr» → «Açarlar».</li><li>«Məzənnə rejimi» üçün «Üzən məzənnə» seçin.</li><li>Faiz Taylor qaydası, məzənnə UİP/PPP ilə müəyyən olunur; dövri blok (inflyasiya–faiz–məzənnə) avtomatik yaxınlaşdırılır.</li></ol></div>' +
      '<div class="card recipe"><h4>Manual inflyasiya proqnozu</h4><ol><li>«Açarlar»da «İQİ inflyasiyası: proqnoz metodu» — Manual.</li><li>«Manual proqnozlar»da illər üzrə inflyasiyanı yazın.</li><li>Model rejimində eyni proqnozu saxlamaq üçün «Uzlaşdırma» → «Kalibrlə».</li></ol></div></div></section>';
    h += '<section class="gsec" id="g-metod"><h2>Model və manual proqnoz</h2><p>Özəl istehlak, investisiya, ixrac, idxal, inflyasiya və siyasət faizi üçün iki yol var. <b>Model</b> — kalibrə edilmiş davranış tənlikləri (əmsallar «Tənlik əmsalları» bölməsində; C2 vərəqində OLS qiymətləndirmələri başlanğıc nöqtəsidir). <b>Manual</b> — mühakimə, peyk modelləri və ya digər təhlillərə əsaslanan proqnoz sarı xanalara yazılır. Seçim bütün proqnoz dövrünə aiddir. «Nə olarsa» ssenariləri üçün bütün proqnozlar model əsaslı olmalıdır; manual proqnozu model ilə təkrarlamaq üçün əlavə amillərdən (add-factor) istifadə olunur.</p></section>';
    h += '<section class="gsec" id="g-uzlas"><h2>Uzlaşdırma və kalibrləmə</h2><p>İstehsal üsulu ilə real ÜDM (sahələr) və xərclər üsulu ilə real ÜDM (davranış tənlikləri) fərqli ola bilər. «ResidualYP» təklif tərəfi artımını, «ResidualCP» tələb tərəfi düzəlişini dəyişərək hər il üçün fərqi və ÜDM deflyatoru fərqini sıfıra endirir. «CaliManual» əlavə amilləri elə seçir ki, model tənlikləri son (manual) proqnozları təkrarlasın. Excel-dəki saxlanmış baza uzlaşdırılmayıb — nəticələrə baxmazdan əvvəl uzlaşdırmanı işə salmaq tövsiyə olunur.</p></section>';
    h += '<section class="gsec" id="g-yenil"><h2>Yeni il və yeni fayl</h2><p>İl başa çatanda «Yeniləmə» bölməsində: (1) həmin ilin faktiki rəqəmlərini daxil edin (sistem «Data» vərəqinin tələb etdiyi bütün sıraları siyahıya alır və onları ilkin məlumat xanalarına bağlayır); (2) yeni üfüq ili üçün xarici mühit fərziyyələrini verin; (3) «Yoxla» ilə sınaq hesablaması aparın; (4) proqnozun ilk ilini irəli çəkin — bütün vərəqlər CAEM-in öz qaydası ilə yeni illərə keçir, əl ilə daxil edilmiş proqnoz sətirləri bir sütun sola sürüşür. Nazirlik yeni CAEM faylı hazırlayıbsa, onu yükləyin: sistem düsturları oxuyur, Excel nəticələri ilə yoxlayır və yalnız sonra aktivləşdirir.</p></section>';
    h += '<section class="gsec" id="g-luget"><h2>Terminlər</h2><dl class="gloss"><dt>Buraxılış kəsiri</dt><dd>Faktiki real ÜDM-in potensial ÜDM-dən faizlə fərqi; inflyasiya və faiz tənliklərinə daxil olur.</dd><dt>HP filtri</dt><dd>Hodrik–Preskott filtri: sıranı trend və tsiklik hissəyə ayırır (illik məlumat üçün λ=100); prior-larla versiyada istifadəçi müəyyən illər üçün trendi təyin edə bilər.</dd><dt>Phillips əyrisi</dt><dd>İnflyasiyanı gecikmiş və gözlənilən inflyasiya, idxal inflyasiyası və buraxılış kəsiri ilə əlaqələndirən tənlik.</dd><dt>Taylor qaydası</dt><dd>Siyasət faizinin neytral faiz, inflyasiyanın hədəfdən kənarlaşması və buraxılış kəsirinə reaksiyası.</dd><dt>UİP / PPP</dt><dd>Açıq faiz pariteti və alıcılıq qabiliyyəti pariteti — üzən rejimdə məzənnəni müəyyən edir.</dd><dt>Xəta-korreksiya tənliyi</dt><dd>Qısamüddətli dinamika ilə uzunmüddətli tarazlığa qayıdışı (λ — uyğunlaşma sürəti) birləşdirən tənlik.</dd><dt>Əlavə amil (add-factor)</dt><dd>Tənliyin proqnozuna mühakimə ilə edilən düzəliş.</dd><dt>ARDNF</dt><dd>Azərbaycan Respublikasının Dövlət Neft Fondu (SOFAZ).</dd></dl></section>';
    h += '<section class="gsec" id="g-sual"><h2>Tez-tez verilən suallar</h2>' + [
      ['Dəyişikliklərim harada saxlanılır?', 'Bu brauzerin yaddaşında. Başqa kompüterə köçürmək və ya paylaşmaq üçün «Ssenarilər» → JSON ixrac.'],
      ['Nəticələr Excel ilə eynidirmi?', 'Bəli: bütün ' + M.order.length.toLocaleString('az') + ' düstur Excel-in saxladığı nəticələrlə yoxlanılıb və 100% üst-üstə düşür. Makroslar Excel-dəki alqoritmlə işləyir.'],
      ['Nə üçün istehsal və xərclər üsulu ilə ÜDM artımı fərqlidir?', 'Excel faylındakı baza uzlaşdırılmayıb. «Uzlaşdırma» bölməsində ResidualYP və ya ResidualCP işə salın.'],

    ].map(function (q) { return '<details class="faq"><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>'; }).join('') + '</section>';

  function openPal() { $('#pal').hidden = false; $('#pal-scrim').hidden = false; var i = $('#pal-in'); i.value = ''; drawPal(''); i.focus(); }

  function drawPal(q) {
    q = fold(q.trim()); var terms = q.split(/\s+/).filter(Boolean);
    var res = palItems().filter(function (x) { return terms.every(function (t) { return x.f.indexOf(t) >= 0; }); }).slice(0, 40);
    PAL_I = 0; $('#pal-list').innerHTML = res.map(function (x, i) { return '<div class="pal-item' + (i ? '' : ' on') + '" data-i="' + i + '"><span class="k">' + x.k + '</span><div>' + esc(x.t) + '<small>' + esc(x.s) + '</small></div></div>'; }).join('') || '<div class="pal-item">Nəticə yoxdur</div>';
    drawPal.res = res;
  }

  // ------------------------------------------------------------------ report
  function initReport() {
    if (!window.MakroReport) return;
    window.MakroReport.init({
      ns: 'caemModel',
      org: 'Azərbaycan Respublikası İqtisadiyyat Nazirliyi',
      model: 'CAEM · orta müddətli proqnoz modeli',
      pageTitle: 'Hesabat hazırla',
      leadCustom: 'İstədiyiniz göstəriciləri və illəri seçin, başlıq verin — sənəd dərhal hazırlanır. Excel faylı kimi yükləyin və ya PDF-ə çap edin. Rəqəmlər cari ssenaridən götürülür, «Baza» sütunu isə dəyişikliksiz modeli göstərir.',
      footer: 'Mənbə: CAEM proqnoz modeli (BVF FPP 2.0 çərçivəsi), İqtisadiyyat Nazirliyi.',
      defaultTitle: 'Makroiqtisadi proqnoz ' + (INFO.firstYear || '') + '–' + (INFO.endYear || ''),
      defaultItems: ['gdp', 'nonoil', 'cpi', 'fx', 'cagdp', 'debt'],
      years: function () { return { all: YEARS, forecastFrom: INFO.firstYear }; },
      sections: function () {
        return SECS.map(function (t, i) {
          return {
            id: 's' + i, title: t,
            items: KPI.filter(function (k) { return k.sec === i; }).map(function (k) {
              return { id: k.k, name: k.t, unit: k.u, sub: !!k.sub, dec: k.dec };
            })
          };
        }).filter(function (s) { return s.items.length; });
      },
      value: function (it, y, base) { var k = byKey(it.id); return k ? kpiVal(k, y, base) : null; },
      scenarioName: function () { var n = editCount(); return n ? n + ' dəyişiklik · ssenari' : 'baza'; },
      nf: nf,
      toast: toast
    });
  }

  // ------------------------------------------------------------------ boot
  function boot() {
    Store.boot(function (model, info) {
      try {
        M = model; INFO = info; CORE = window.MODEL_CORE; META = window.MODEL_META || META; SHEETS = CORE.sheets;
        SHEETS.forEach(function (s, gs) { if (CORE.books[s.b].kind === 'model') SIDX[s.n] = gs; });
        LOCK = Store.layout && Store.layout.b9 >= 0 ? Store.layout.b9 : -1;
        YEARS = []; for (var y = INFO.firstYear - 2; y <= INFO.endYear; y++) YEARS.push(y);
        FYEARS = []; for (y = INFO.firstYear; y <= INFO.endYear; y++) FYEARS.push(y);
        var pv = null; try { pv = JSON.parse(lsGet(LS_PANEL) || 'null'); } catch (e) { /* ignore */ }
        YEAR = pv && FYEARS.indexOf(pv.year) >= 0 ? pv.year : INFO.firstYear;
        M.dependents();
        buildInputs();
        LAST_MACRO = loadMacro();
        initReport();
        try { var saved = JSON.parse(lsGet(LS_EDITS) || 'null'); if (saved) loadEdits(saved); } catch (e) { /* ignore corrupt storage */ }
        $('#brand-sub').textContent = 'İş paneli · proqnoz ' + INFO.firstYear + '–' + INFO.endYear;
        window.addEventListener('hashchange', route);
        $('#scrim').onclick = closeDrawer;
        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); }
          if (e.key === 'Escape') { closeDrawer(); closePal(); }
          if (!$('#pal').hidden) {
            var items = $$('.pal-item[data-i]');
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PAL_I = Math.max(0, Math.min(items.length - 1, PAL_I + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach(function (x, i) { x.classList.toggle('on', i === PAL_I); }); }
            if (e.key === 'Enter' && drawPal.res && drawPal.res[PAL_I]) { closePal(); drawPal.res[PAL_I].go(); }
          }
        });
        $('#open-pal').onclick = openPal; $('#pal-scrim').onclick = closePal;
        $('#pal-in').oninput = function () { drawPal(this.value); };
        $('#pal-list').onclick = function (e) { var it = e.target.closest('[data-i]'); if (it && drawPal.res) { closePal(); drawPal.res[+it.getAttribute('data-i')].go(); } };
        route();
        $('#boot').remove();
        if (window.CaemUpdate) window.CaemUpdate.pendingToast();
      } catch (e) { $('#boot').textContent = 'Model yüklənmədi: ' + e.message; console.error(e); }
    });
  }
  window.CaemPanel = { inputs: function () { return INP; }, model: function () { return M; }, yearOfId: function (id) { return cellYear(id); } };
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
