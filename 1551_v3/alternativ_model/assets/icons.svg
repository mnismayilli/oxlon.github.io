<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" data-sprite="miis-1551">
  <!--
    icons.svg — line icon sprite for the §15.5.1 site (blueprint §4).
    Style: 24×24 box, 1.6 stroke set by CSS (.icon), fill none, stroke currentColor,
    round caps and joins. Used small (15-18px), functional only.
    build_site.py inlines this file into every page so <use href="#icon-…"> resolves
    when the page is opened directly from disk (file://), where an external sprite
    reference is blocked.
  -->

