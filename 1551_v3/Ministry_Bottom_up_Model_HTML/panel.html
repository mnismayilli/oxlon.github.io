<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makro Model İş Paneli</title>
<style>
:root {
  color-scheme: light;
  --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #F8FAFB; --sunk: #EEF2F5;
  --ink: #15202B; --ink-2: #455463; --muted: #738190; --line: #DDE3E9; --line-2: #EDF1F4;
  --accent: #0E6F7C; --accent-ink: #0A5560; --accent-soft: #E1F0F2;
  --scen: #1F6FB2; --scen-soft: #E6EFF8; --base: #E07B00;
  --up: #1E7B4F; --up-soft: #E5F3EB; --down: #B3261E; --down-soft: #FBE9E7;
  --warn: #8A5300; --warn-soft: #FFF2D9; --coef: #6A3FB5; --coef-soft: #F0EAFA;
  --fc: #F2F7FB;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
  --r: 8px; --top: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding-inline: 20px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.mark { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #0E6F7C 0 50%, #1F6FB2 50% 100%); flex: none; }
.brand b { font-size: 15px; display: block; line-height: 1.1; } .brand small { color: var(--muted); font-size: 11.5px; }
.tabs { display: flex; gap: 2px; margin-left: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 7px; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; border: 0; background: none; cursor: pointer; }
.tab:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
.tab.on { background: var(--accent-soft); color: var(--accent-ink); }
.tab svg { width: 16px; height: 16px; flex: none; }
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.kbtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--muted); cursor: pointer; min-width: 220px; }
.kbtn:hover { border-color: var(--accent); }
.kbtn kbd { margin-left: auto; font: 11px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink-2); }
.ibtn { display: inline-flex; align-items: center; justify-content: center; height: 36px; min-width: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 700; color: var(--ink-2); white-space: nowrap; font-size: 13px; }
.ibtn:hover { border-color: var(--accent); color: var(--accent-ink); }

/* ---------- scenario status bar ---------- */
.scenbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); z-index: 25; background: var(--scen-soft); border-bottom: 1px solid #C9DBEE; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 20px; font-size: 13.5px; }
.scenbar b { color: var(--scen); }
.dotline { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- layout ---------- */
.view { max-width: 1320px; margin: 0 auto; padding-inline: 24px; padding-block: 26px 80px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
.lead { color: var(--ink-2); font-size: 16px; max-width: 70ch; margin: 8px 0 0; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h h2 { font-size: 19px; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pad { padding: 16px 18px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent-ink); text-decoration: none; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.pri:hover { background: var(--accent-ink); color: #fff; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; line-height: 1.7; }
.chip.acc { background: var(--accent-soft); color: var(--accent-ink); }
.chip.scen { background: var(--scen-soft); color: var(--scen); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.coef { background: var(--coef-soft); color: var(--coef); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.help { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--sunk); color: var(--ink-2); font-size: 11px; font-weight: 700; cursor: help; vertical-align: 1px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
.hero-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hk { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.hk b { font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hk span { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.action { display: flex; flex-direction: column; gap: 8px; padding: 18px; color: var(--ink); min-height: 150px; }
a.action:hover { text-decoration: none; border-color: var(--accent); box-shadow: 0 4px 16px rgba(14,111,124,.08); }
.action .ic { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.action .ic svg { width: 20px; height: 20px; }
.action h3 { font-size: 16px; } .action p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.action .go { margin-top: auto; font-weight: 700; color: var(--accent); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.step { padding: 16px 18px; position: relative; border-right: 1px solid var(--line-2); }
.step:last-child { border-right: 0; }
.step .n { font: 700 12px var(--mono); color: var(--accent); }
.step h4 { font-size: 15px; margin: 4px 0; } .step p { margin: 0; font-size: 13px; color: var(--ink-2); }
.step .cnt { margin-top: 8px; font-size: 12px; color: var(--muted); }

/* ---------- results ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.kpi:hover { border-color: var(--accent); }
.kpi .l { font-size: 12.5px; color: var(--ink-2); font-weight: 600; line-height: 1.3; min-height: 2.6em; }
.kpi .v { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .v small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; letter-spacing: 0; }
.kpi .d { font-size: 12px; font-weight: 700; min-height: 1.5em; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); } .dl { color: var(--scen); font-weight: 700; }
.spark { display: block; width: 100%; height: auto; }
.itbl-wrap { overflow-x: auto; }
table.itbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.itbl th, .itbl td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.itbl thead th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: right; background: var(--surface-2); position: sticky; top: 0; }
.itbl thead th.l { text-align: left; }
.itbl thead th .st { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.itbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
.itbl td.fc, .itbl th.fc { background: var(--fc); }
.itbl tbody tr { cursor: pointer; }
.itbl tbody tr:hover td { background: #EAF3F6; }
.itbl td.lab { white-space: normal; min-width: 240px; }
.itbl td.lab .u { color: var(--muted); font-size: 12px; margin-left: 6px; }
.itbl tr.sub td.lab { padding-left: 26px; color: var(--ink-2); }
.itbl tr.chg td.n.fc { color: var(--scen); font-weight: 700; }
.itbl .dcell { font-size: 12px; font-weight: 700; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
.toolbar input[type=search] { height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; min-width: 240px; background: var(--surface); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- scenario ---------- */
.scen-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
.impact { position: sticky; top: calc(var(--top) + 60px); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.assump { padding: 14px 16px; display: grid; grid-template-columns: minmax(200px, 1fr) auto; gap: 10px 16px; align-items: center; border-bottom: 1px solid var(--line-2); }
.assump:last-child { border-bottom: 0; }
.assump h4 { font-size: 14.5px; } .assump .src { font-size: 12px; color: var(--muted); }
.assump .why { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.yrs { display: grid; grid-template-columns: repeat(var(--ny, 6), 78px); gap: 6px; }
.yr { display: flex; flex-direction: column; gap: 2px; }
.yr label { font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.yr input { height: 32px; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; font-variant-numeric: tabular-nums; background: var(--surface); }
.yr input:focus { border-color: var(--scen); outline: none; box-shadow: 0 0 0 3px var(--scen-soft); }
.yr input.follow { background: var(--surface-2); color: var(--ink-2); }
.yr input.mod { background: #FFF3BF; border-color: #E5C24F; color: #5A3C00; font-weight: 700; }
.a-tools { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.a-tools input { width: 70px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; }
.grp-h { padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; border-radius: 10px 10px 0 0; }
.imp-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; align-items: baseline; }
.imp-row:last-child { border-bottom: 0; }
.imp-row .b { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.imp-row .d { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; min-width: 78px; }

/* exogenous catalogue */
.sectabs { display: flex; gap: 6px; flex-wrap: wrap; }
.stab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.stab:hover { border-color: var(--accent); color: var(--accent-ink); }
.stab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.stab .cnt { font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }
.xlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.xlegend .sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); vertical-align: -1px; margin-right: 5px; }
.xlegend .sw.follow { background: var(--surface-2); } .xlegend .sw.calc { background: var(--sunk); } .xlegend .sw.mod { background: #FFF3BF; border-color: #E5C24F; }
.xbook { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; margin: 18px 0 8px; }
.xbook:first-child { margin-top: 0; }
details.xgrp { margin-bottom: 8px; }
details.xgrp > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.xgrp > summary::-webkit-details-marker { display: none; }
details.xgrp > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.xgrp[open] > summary::before { transform: rotate(90deg); }
details.xgrp[open] > summary { border-bottom: 1px solid var(--line-2); }
.xs-t { font-weight: 700; }
.xhead, .xrow { display: grid; grid-template-columns: minmax(200px, 1fr) auto 122px; gap: 6px 14px; align-items: center; padding: 8px 14px; }
.xhead { padding-block: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
.xhead .yrs span { text-align: center; }
.xrow { border-top: 1px solid var(--line-2); }
.xrow.xmod { background: #FFFCEB; }
.xrow.flash { background: #FFF3BF; transition: background .3s; }
.xrow .yr label { display: none; }
.xl { font-size: 13px; line-height: 1.35; }
.xl .rn { font: 11px var(--mono); color: var(--muted); margin-right: 6px; }
.xl .blk { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.xt { display: flex; gap: 4px; align-items: center; }
.xt input { width: 58px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-align: right; }
.yr input.calc { background: var(--sunk); color: var(--muted); font-style: italic; border-color: var(--line-2); }

/* ---------- explorer ---------- */
.exp-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.tree { position: sticky; top: calc(var(--top) + 16px); max-height: calc(100vh - var(--top) - 32px); overflow-y: auto; padding: 8px 0; }
.tree input { margin: 4px 12px 8px; width: calc(100% - 24px); height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; }
.tsec { padding: 10px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tbook { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--ink); }
.tbook:hover { background: var(--surface-2); }
.tsheet { display: block; padding: 4px 14px 4px 34px; font-size: 13px; color: var(--ink-2); border-left: 3px solid transparent; }
.tsheet:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.tsheet.on { background: var(--accent-soft); color: var(--accent-ink); border-left-color: var(--accent); font-weight: 700; }
.tsheet small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.map .col h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; }
.wb { display: block; padding: 12px 14px; margin-bottom: 10px; color: var(--ink); border-left: 4px solid var(--line); }
.wb:hover { text-decoration: none; border-color: var(--accent); }
.wb b { display: block; } .wb span { font-size: 12.5px; color: var(--ink-2); display: block; margin-top: 3px; }
.wb small { font-size: 11.5px; color: var(--muted); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(21,32,43,.28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 41; box-shadow: -16px 0 40px rgba(21,32,43,.18); overflow-y: auto; padding: 22px 24px 60px; }
.drawer h3 { font-size: 20px; }
.path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.path .p { background: var(--sunk); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 11.5px; }
.fx { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; line-height: 2; word-break: break-word; }
.rchip { display: inline-flex; align-items: baseline; gap: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; font-family: var(--font); font-size: 12.5px; line-height: 1.7; cursor: pointer; color: var(--ink); }
.rchip:hover { border-color: var(--accent); }
.rchip b { font-variant-numeric: tabular-nums; }
.rchip.ext { border-color: #BFE0CE; background: #F2FAF5; }
.lit { color: var(--coef); font-weight: 700; background: var(--coef-soft); border-radius: 4px; padding: 0 3px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 5; transform: translate(-50%, -110%); }
.chart-wrap { position: relative; }

/* ---------- palette ---------- */
.pal { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); background: var(--surface); border-radius: 12px; z-index: 51; box-shadow: 0 24px 60px rgba(21,32,43,.28); overflow: hidden; }
.pal input { width: 100%; height: 52px; border: 0; border-bottom: 1px solid var(--line); padding: 0 18px; font-size: 16px; outline: none; }
.pal-list { max-height: 52vh; overflow-y: auto; }
.pal-item { display: flex; gap: 10px; align-items: baseline; padding: 9px 18px; cursor: pointer; }
.pal-item.on, .pal-item:hover { background: var(--accent-soft); }
.pal-item .k { font-size: 11px; font-weight: 700; color: var(--muted); width: 88px; flex: none; text-transform: uppercase; letter-spacing: .05em; }
.pal-item small { color: var(--muted); display: block; font-size: 12px; }
.pal-foot { padding: 8px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface-2); }

/* ---------- tour ---------- */
.tour-hole { position: fixed; z-index: 61; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(21,32,43,.5); pointer-events: none; transition: all .2s ease; }
.tour-card { position: fixed; z-index: 62; width: min(360px, calc(100% - 32px)); background: var(--surface); border-radius: 12px; padding: 16px 18px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.tour-card h4 { font-size: 16px; margin-bottom: 6px; } .tour-card p { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; }
.tour-card .row { display: flex; align-items: center; gap: 8px; }
.tour-card .row .muted { margin-right: auto; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .tour-hole { transition: none; } }

/* ---------- guide ---------- */
.guide { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: calc(var(--top) + 20px); display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.toc a { padding: 5px 10px; border-radius: 6px; color: var(--ink-2); }
.toc a:hover { background: var(--sunk); text-decoration: none; }

  function p3Cols(gs, headRow) {

      }, {

    } else {

    }
    for (var r = P.r0; r <= P.r1; r++) {
      var lab = p3Text(gs, r, 1), unit = p3Text(gs, r, 2);

  }
  function pages3() {
    return P3.map(function (P) { return { id: P.id, name: P.name, grid: function (y0, y1) { return p3Grid(P, y0, y1); } }; });
  }
  function initReport() {
    if (!window.MakroReport) return;
    window.MakroReport.init({
      ns: 'makroModel',
      org: 'Azərbaycan Respublikası İqtisadiyyat Nazirliyi',
      model: 'Aşağıdan-yuxarı makroiqtisadi model',
      pageTitle: 'Hesabat hazırla',
      leadCustom: 'İstədiyiniz göstəriciləri və illəri seçin, başlıq verin — sənəd dərhal hazırlanır. Excel faylı kimi yükləyin və ya PDF-ə çap edin. Rəqəmlər cari ssenaridən götürülür.',
      leadP3: 'Nazirliyin «MOE REPORT 3 PAGES» formasının canlı versiyası: xülasə, əsas cədvəl və ssenari müqayisəsi. Bütün rəqəmlər modeldən hesablanır, ona görə ssenarini dəyişdikdə hesabat da dəyişir.',
      footer: 'Mənbə: Aşağıdan-yuxarı makroiqtisadi model (11 Excel iş kitabı), İqtisadiyyat Nazirliyi.',
      defaultTitle: 'Makroiqtisadi proqnoz ' + (LA + 1) + '–' + END,
      defaultItems: ['4', '6', '13', '124', '92', '142'],
      years: function () { return { all: YEARS, forecastFrom: LA + 1 }; },
      sections: function () {
        return INDSEC.map(function (s) {
          return { id: s.t, title: s.t, items: s.rows.map(function (it) { return { id: String(it.r), name: it.name, unit: it.unit, sub: it.sub, dec: 1 }; }) };
        });
      },
      value: function (it, y, base) { return b60(+it.id, y, base); },
      scenarioName: function () { var n = editCount(); return n ? n + ' dəyişiklik · ssenari' : BASE; },
      nf: nf,
      toast: toast,
      pages3: pages3
    });
  }

  // ---------------------------------------------------------------- econometrics
  function initEcon() {
    if (!window.EconUI) return;
    window.EconUI.init({
      sheetIdx: sheetIdx,
      cellId: cellId,
      colForYear: colForYear,
      model: function () { return M; },
      value: function (id) { return M.V[id]; },
      baseValue: function (id) { return M.V0[id]; },
      setCell: setCell,
      resetCell: resetCell,
      isEdited: isEdited,
      changed: changed,
      years: function () { return { first: 1995, last: END, lastActual: LA }; },
      nf: nf,
      toast: toast
    });
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    window.MakroStore.boot(function (model, info) {
      try { boot2(model, info); } catch (e) { $('#boot').textContent = 'Model yüklənmədi: ' + e.message; console.error(e); }
    });
  }
  function boot2(model, info) {
    M = model; window.__M = M; CORE = window.MODEL_CORE; META = window.MODEL_META || META; BOOKS = CORE.books; SHEETS = CORE.sheets;
    setYears(info);
    YEAR = +(lsGet(LS_YEAR) || FP0); if (FYEARS.indexOf(YEAR) < 0) YEAR = FP0;
    PRESETS.forEach(function (p) { p.d = p.d.replace('2026–2030', RANGE_F); });
    var bs = $('.brand small'); if (bs) bs.textContent = 'İş paneli · 1995–' + END;
    TPL_NL = CORE.disp.map(function (d) { return (d.match(/\x01/g) || []).length; });
    KOWNER = new Int32Array(M.K.length).fill(-1);
    for (var j = 0; j < M.order.length; j++) { var id = M.order[j], n = TPL_NL[M.ft[id]]; for (var q = 0; q < n; q++) KOWNER[M.fk[id] + q] = id; }
    M.dependents();
    try { var saved = JSON.parse(lsGet(LS_EDITS) || 'null'); if (saved) applySerialized(saved); } catch (e) { /* ignore corrupt storage */ }
    buildIndicators();
    initReport();
    initEcon();
    renderScenBar();
    window.addEventListener('hashchange', route);
    $('#open-pal').onclick = openPal;
    $('#pal-scrim').onclick = closePal;
    $('#scrim').onclick = closeDrawer;
    $('#tour-btn').onclick = startTour;
    $('#pal-in').addEventListener('input', function () { drawPal(this.value); });
    $('#pal-list').addEventListener('click', function (e) { var it = e.target.closest('[data-i]'); if (it) pickPal(+it.getAttribute('data-i')); });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').hidden ? openPal() : closePal(); return; }
      if (!$('#pal').hidden) {
        var items = $$('.pal-item[data-i]');
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PAL_SEL = Math.max(0, Math.min(items.length - 1, PAL_SEL + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach(function (x, i) { x.classList.toggle('on', i === PAL_SEL); }); if (items[PAL_SEL]) items[PAL_SEL].scrollIntoView({ block: 'nearest' }); }
        if (e.key === 'Enter') { e.preventDefault(); pickPal(PAL_SEL); }
        if (e.key === 'Escape') closePal();
        return;
      }
      if (e.key === 'Escape') { if (!$('#tour').hidden) endTour(); else closeDrawer(); }
    });
    window.addEventListener('storage', function (e) { if (e.key === LS_EDITS) { try { applySerialized(JSON.parse(e.newValue || '{}')); renderScenBar(); rerender(); } catch (x) { /* ignore */ } } });
    window.addEventListener('resize', function () { if (!$('#tour').hidden) showTour(); });
    route();
    $('#boot').remove();
    if (window.MakroUpdate) window.MakroUpdate.pendingToast();
    if (lsGet(LS_TOUR) !== 'done' && !location.hash.replace(/^#\/?/, '')) setTimeout(startTour, 400);
  }
  window.addEventListener('DOMContentLoaded', function () { try { boot(); } catch (e) { $('#boot').textContent = 'Model yüklənmədi: ' + e.message; console.error(e); } });
})();
</script>
</body>
</html>
